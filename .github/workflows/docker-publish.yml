name: Publish Docker image

on:
  release:
    types: [ published ]
  # Manual build for forks / pre-release images: the release trigger only fires
  # on the upstream repo's published releases, so a fork has no way to produce
  # an image without cutting a tag that would also drag the whole release
  # pipeline along.
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag (empty = sha-<short>)'
        required: false
        default: ''
      latest:
        description: 'Also tag as latest'
        type: boolean
        default: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        # A release build pins the published tag; a manual run (no release
        # payload) builds the ref it was dispatched on.
        ref: ${{ github.event.release.tag_name || github.sha }}
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Log in to Docker Hub
      env:
        DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      if: env.DOCKERHUB_USER != '' && env.DOCKERHUB_TOKEN != ''
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}
    - name: Determine Docker images
      id: images
      env:
        DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      run: |
        TARGETS="ghcr.io/${{ github.repository }}"
        if [ -n "$DOCKERHUB_USER" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
          TARGETS="$TARGETS
        ${{ github.repository }}"
        fi
        echo "list<<EOF" >> $GITHUB_OUTPUT
        echo "$TARGETS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    - name: Extract Docker metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.images.outputs.list }}
        # Release builds are tagged with the release tag (and latest when it is
        # not a prerelease). A manual run has no release payload, so it uses the
        # optional tag input or falls back to sha-<short>, and latest only when
        # explicitly asked for — a fork must not silently shadow upstream's
        # latest.
        tags: |
          type=raw,value=${{ github.event.release.tag_name }},enable=${{ github.event_name == 'release' }}
          type=raw,value=${{ inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' }}
          type=sha,format=short,enable=${{ github.event_name == 'workflow_dispatch' && inputs.tag == '' }}
          type=raw,value=latest,enable=${{ github.event_name == 'release' && !github.event.release.prerelease || github.event_name == 'workflow_dispatch' && inputs.latest }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v6
      with:
        context: .
        push: true
        platforms: linux/amd64,linux/arm64
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
